version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 25
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    # Renovate's "vite-plus monorepo" group owns vite-plus so its vite alias moves with it.
    # vitest and @vitest/coverage-v8 must match the vitest that vite-plus bundles, so they move in that group too.
    ignore:
      - dependency-name: "vite-plus"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
    # Only group dependencies that must move in lockstep.
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
      actions-toolkit:
        patterns:
          - "@actions/*"
    commit-message:
      prefix: "dependabot"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 25
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "dependabot"
      include: "scope"
