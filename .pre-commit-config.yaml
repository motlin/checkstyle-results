repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
        # Exclude JSONC files (JSON with Comments) as they need comment support
        exclude: "tsconfig.*\\.json|package-lock\\.json"
      - id: check-toml
      - id: check-xml
      - id: end-of-file-fixer
        # badges/coverage.svg is written by make-coverage-badge without a trailing newline
        exclude: "package-lock\\.json|^\\.idea/|^dist/|^badges/"
      - id: trailing-whitespace
        exclude: "package-lock\\.json|^\\.idea/|^dist/"
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: "^dist/"

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt-next-line
        entry: oxfmt-next-line --no-error-on-unmatched-pattern
        language: system
        # Show "Finished in Xms on N files" so every run proves formatting happened.
        verbose: true

      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        files: \.(js|jsx|ts|tsx|mjs|cjs)$
        exclude: "^dist/"
        types: [file]
